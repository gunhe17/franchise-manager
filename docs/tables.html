<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Franchise Manager — Tables</title>
  <style>
    :root {
      --canvas-bg: #f6f7f9;
      --card-bg: #ffffff;
      --card-border: rgba(15, 17, 21, 0.08);
      --card-shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
      --header-bg: rgba(255,255,255,0.88);
      --header-border: #e5e7eb;
      --row-hover: rgba(0,0,0,0.03);
      --fg: #0f1115;
      --fg-muted: #6b7280;
      --fg-faint: #9ca3af;
      --accent: #4f46e5;
      --accent-soft: rgba(79,70,229,0.08);
      --pk-bg: rgba(37,99,235,0.12);
      --pk-fg: #1d4ed8;
      --fk-bg: rgba(249,115,22,0.12);
      --fk-fg: #c2410c;
      --uk-bg: rgba(139,92,246,0.14);
      --uk-fg: #6d28d9;
      --nn-bg: rgba(107,114,128,0.12);
      --nn-fg: #4b5563;
      --memo-bg: #fafbff;
      --memo-tint: rgba(79,70,229,0.04);
      --saved-fg: #059669;
      --note-fg: #9ca3af;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas-bg: #16171b;
        --card-bg: #22252b;
        --card-border: rgba(255,255,255,0.07);
        --card-shadow: 0 1px 2px rgba(0,0,0,0.4);
        --header-bg: rgba(22,23,27,0.9);
        --header-border: rgba(255,255,255,0.07);
        --row-hover: rgba(255,255,255,0.03);
        --fg: #f3f4f6;
        --fg-muted: #a1a5af;
        --fg-faint: #6b7280;
        --accent: #818cf8;
        --accent-soft: rgba(129,140,248,0.14);
        --pk-bg: rgba(96,165,250,0.18);
        --pk-fg: #93c5fd;
        --fk-bg: rgba(251,146,60,0.18);
        --fk-fg: #fdba74;
        --uk-bg: rgba(167,139,250,0.2);
        --uk-fg: #c4b5fd;
        --nn-bg: rgba(156,163,175,0.16);
        --nn-fg: #d1d5db;
        --memo-bg: #1c1e23;
        --memo-tint: rgba(129,140,248,0.06);
        --saved-fg: #34d399;
        --note-fg: #7b818c;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--canvas-bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header.app {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 24px;
      background: var(--header-bg);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--header-border);
    }
    .brand {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.01em;
    }
    .brand .accent { color: var(--accent); }
    .meta {
      font-size: 12px;
      color: var(--fg-muted);
    }
    .actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .filter {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--fg);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      width: 200px;
    }
    .filter::placeholder { color: var(--fg-faint); }
    .filter:focus {
      outline: none;
      border-color: var(--accent);
    }
    .actions button {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--fg);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .actions button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .actions button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .actions button.primary:hover { opacity: 0.92; color: white; }
    .actions button.ghost {
      color: var(--fg-muted);
    }

    main {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 1680px;
      margin: 0 auto;
    }
    .row-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .group-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--fg-muted);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      padding-left: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .group-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--card-border);
    }
    .row {
      display: grid;
      gap: 18px;
      align-items: stretch;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    @media (max-width: 1100px) {
      .row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .row { grid-template-columns: minmax(0, 1fr); }
    }
    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .table-card.hidden { display: none; }
    .table-card.has-memo {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-soft), var(--card-shadow);
    }
    .card-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .card-titleblock { flex: 1; min-width: 0; }
    .card-title {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .card-desc {
      font-size: 12px;
      color: var(--fg-muted);
      margin-top: 4px;
      line-height: 1.45;
    }
    .col-count {
      font-size: 11px;
      color: var(--fg-faint);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .columns {
      padding: 4px 0;
    }
    .column {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: 10px;
      padding: 5px 16px;
      font-size: 12px;
      min-height: 26px;
    }
    .column:hover { background: var(--row-hover); }
    .col-name {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .col-name.nullable { color: var(--fg-muted); }
    .col-name.nullable::after {
      content: "?";
      color: var(--fg-faint);
      margin-left: -3px;
    }
    .col-type {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: var(--fg-muted);
      font-size: 11px;
      flex-shrink: 0;
    }
    .col-note {
      padding: 0 16px 4px;
      margin-top: -2px;
      font-size: 11px;
      color: var(--note-fg);
      line-height: 1.4;
    }
    .pill {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 1px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      font-family: -apple-system, sans-serif;
    }
    .pill.pk { background: var(--pk-bg); color: var(--pk-fg); }
    .pill.fk { background: var(--fk-bg); color: var(--fk-fg); }
    .pill.uk { background: var(--uk-bg); color: var(--uk-fg); }
    .pill.nn { background: var(--nn-bg); color: var(--nn-fg); }

    .extras {
      padding: 6px 16px 10px;
      border-top: 1px dashed var(--card-border);
      font-size: 11px;
      color: var(--fg-muted);
      line-height: 1.5;
    }
    .extras .label {
      font-weight: 600;
      color: var(--fg);
    }

    .memo {
      margin-top: auto;
      border-top: 1px solid var(--card-border);
      background: var(--memo-tint);
      padding: 10px 12px 12px;
    }
    .memo-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--fg-muted);
      margin-bottom: 6px;
    }
    .memo-label .icon { opacity: 0.7; }
    .memo textarea {
      width: 100%;
      border: 1px solid var(--card-border);
      background: var(--memo-bg);
      color: var(--fg);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      min-height: 60px;
      line-height: 1.5;
      transition: border-color 0.12s;
    }
    .memo textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .memo textarea::placeholder { color: var(--fg-faint); }
    .saved-indicator {
      font-size: 10px;
      color: var(--fg-faint);
      transition: color 0.2s;
    }
    .saved-indicator.saved { color: var(--saved-fg); }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--fg);
      color: var(--card-bg);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .legend {
      padding: 0 24px 18px;
      margin-top: -8px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--fg-muted);
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
  </style>
</head>
<body>
  <header class="app">
    <div class="brand">Franchise Manager <span class="accent">·</span> Tables</div>
    <div class="meta" id="meta"></div>
    <div class="actions">
      <input class="filter" id="filter" placeholder="테이블 / 컬럼 검색...">
      <button class="ghost" id="btn-clear">메모 초기화</button>
      <button class="primary" id="btn-export">피드백 복사</button>
    </div>
  </header>

  <div class="legend">
    <div class="legend-item"><span class="pill pk">PK</span> Primary Key</div>
    <div class="legend-item"><span class="pill fk">FK</span> Foreign Key</div>
    <div class="legend-item"><span class="pill uk">UK</span> Unique</div>
    <div class="legend-item"><span class="col-name nullable">name</span> nullable</div>
    <div class="legend-item">메모가 있는 테이블은 <strong style="color:var(--accent)">강조 테두리</strong>로 표시됩니다.</div>
  </div>

  <main id="canvas"></main>

  <div class="toast" id="toast"></div>

  <script>
    const tables = [
      {
        name: 'brands',
        description: '프랜차이즈 단위. 단일 매장이어도 1행 생성.',
        columns: [
          { name: 'id', type: 'UUID', flags: ['pk'] },
          { name: 'name', type: 'TEXT' },
          { name: 'business_number', type: 'TEXT', nullable: true, note: '사업자등록번호' },
          { name: 'created_at', type: 'TIMESTAMPTZ' },
          { name: 'updated_at', type: 'TIMESTAMPTZ' },
          { name: 'deleted_at', type: 'TIMESTAMPTZ', nullable: true, note: '삭제 시각. NULL이면 활성' }
        ]
      },
      {
        name: 'stores',
        description: '가맹점. 소속 Brand는 brand_stores로 관리 (시간 차원 포함).',
        columns: [
          { name: 'id', type: 'UUID', flags: ['pk'] },
          { name: 'code', type: 'TEXT', flags: ['uk'], note: 'Two Star 원장 가맹점 코드. 주문 인입 매칭 키' },
          { name: 'name', type: 'TEXT' },
          { name: 'address', type: 'JSONB', nullable: true, note: '{ text, latitude, longitude, road_address, postal_code } 형태' },
          { name: 'created_at', type: 'TIMESTAMPTZ' },
          { name: 'updated_at', type: 'TIMESTAMPTZ' },
          { name: 'deleted_at', type: 'TIMESTAMPTZ', nullable: true, note: '삭제 시각. NULL이면 활성' }
        ],
        extras: '리워드 제외는 application 코드의 calculate_credit_rate(order)가 store_id로 분기 처리 (별도 정책 테이블 없음). address는 Kakao Local API로 지오코딩.'
      },
      {
        name: 'brand_stores',
        description: 'Store ↔ Brand M:N (시간 차원). 같은 매장이 시간에 따라 다른 brand에 귀속될 수 있음.',
        columns: [
          { name: 'id', type: 'UUID', flags: ['pk'] },
          { name: 'store_id', type: 'UUID', flags: ['fk'], note: '→ stores.id' },
          { name: 'brand_id', type: 'UUID', flags: ['fk'], note: '→ brands.id' },
          { name: 'effective_from', type: 'TIMESTAMPTZ', note: '효력 시작 (datamodel.md §1.4)' },
          { name: 'effective_to', type: 'TIMESTAMPTZ', nullable: true, note: '효력 종료. NULL이면 현재 활성 (§1.4)' },
          { name: 'created_at', type: 'TIMESTAMPTZ' }
        ],
        extras: '부분 UNIQUE: (store_id) WHERE effective_to IS NULL — 한 시점에 store당 활성 brand 1개만'
      },
      {
        name: 'users',
        description: '리워드 조회·포인트 사용 신청 주체. role 없음.',
        columns: [
          { name: 'id', type: 'UUID', flags: ['pk'] },
          { name: 'phone', type: 'TEXT', nullable: true, flags: ['uk'], note: 'E.164 권장. 카카오 단독 가입 시 NULL 허용. 부분 UNIQUE — 활성 사용자만' },
          { name: 'password', type: 'PASSWORD', nullable: true, note: 'argon2id 해시 도메인 (TEXT 위 CHECK)' },
          { name: 'kakao_user_id', type: 'TEXT', nullable: true, flags: ['uk'], note: '부분 UNIQUE — 활성 사용자만' },
          { name: 'name', type: 'TEXT' },
          { name: 'refresh_token', type: 'TEXT', nullable: true, note: '활성 refresh token 의 fast hash (SHA-256 등). raw 금지. 단일 활성 — 다중 디바이스 미지원' },
          { name: 'created_at', type: 'TIMESTAMPTZ' },
          { name: 'updated_at', type: 'TIMESTAMPTZ' },
          { name: 'deleted_at', type: 'TIMESTAMPTZ', nullable: true, note: '탈퇴 시각. NULL이면 활성' }
        ],
        extras: 'CHECK: kakao_user_id IS NOT NULL OR (phone IS NOT NULL AND password IS NOT NULL). 부분 UNIQUE: (phone) / (kakao_user_id) WHERE deleted_at IS NULL — 탈퇴 후 동일 번호·카카오로 재가입 허용. PASSWORD 도메인은 argon2id 형식 CHECK 강제. PII 마스킹은 현재 미적용 (TBD).'
      },
      {
        name: 'brand_users',
        description: 'User ↔ Brand M:N. Admin이 직접 관리 (별도 신청 워크플로 없음).',
        columns: [
          { name: 'id', type: 'UUID', flags: ['pk'] },
          { name: 'user_id', type: 'UUID', flags: ['fk'], note: '→ users.id' },
          { name: 'brand_id', type: 'UUID', flags: ['fk'], note: '→ brands.id' },
          { name: 'effective_from', type: 'TIMESTAMPTZ', note: '효력 시작 (datamodel.md §1.4)' },
          { name: 'effective_to', type: 'TIMESTAMPTZ', nullable: true, note: '효력 종료. NULL이면 현재 활성 (§1.4)' },
          { name: 'created_at', type: 'TIMESTAMPTZ', note: 'row INSERT 시각 (DB DEFAULT now())' }
        ],
        extras: '부분 UNIQUE: (user_id, brand_id) WHERE effective_to IS NULL — 활성 멤버십 1건만. brand_stores 와 동일한 시간 범위 패턴 (§1.4). effective_from (도메인 효력) ≠ created_at (DB INSERT) — 백데이팅 가능. Admin이 admin 화면에서 직접 INSERT/종료.'
      },
      {
        name: 'admins',
        description: '운영자.',
        columns: [
          { name: 'id', type: 'UUID', flags: ['pk'] },
          { name: 'email', type: 'TEXT', flags: ['uk'], note: '부분 UNIQUE — 활성 admin 만' },
          { name: 'password', type: 'PASSWORD', note: 'argon2id 해시 도메인 (TEXT 위 CHECK)' },
          { name: 'name', type: 'TEXT' },
          { name: 'role', type: 'TEXT', note: "CHECK IN ('super_admin', 'viewer')" },
          { name: 'refresh_token', type: 'TEXT', nullable: true, note: '활성 refresh token 의 fast hash. raw 금지. 단일 활성' },
          { name: 'created_at', type: 'TIMESTAMPTZ' },
          { name: 'updated_at', type: 'TIMESTAMPTZ' },
          { name: 'deleted_at', type: 'TIMESTAMPTZ', nullable: true, note: '삭제 시각. NULL이면 활성' }
        ],
        extras: '부분 UNIQUE: (email) WHERE deleted_at IS NULL — 활성 admin 의 email 만 유일. soft delete (hard delete 금지 — point_requests.decided_by_id (admin 참조 시) / audit_logs.actor_id 참조 보존). PASSWORD 도메인은 argon2id 형식 CHECK 강제 (datamodel.md §1.2).'
      },
      {
        name: 'orders',
        description: '가맹점 주문 1건. 리워드 산정의 트리거.',
        columns: [
          { name: 'id', type: 'UUID', flags: ['pk'] },
          { name: 'store_id', type: 'UUID', flags: ['fk'], note: '→ stores.id' },
          { name: 'external_order_number', type: 'TEXT', note: 'Two Star 원장 주문번호' },
          { name: 'ordered_at', type: 'TIMESTAMPTZ', note: '주문 시각 (리워드 산정 기준)' },
          { name: 'amount', type: 'INTEGER', note: 'KRW, CHECK > 0' },
          { name: 'attributes', type: 'JSONB', nullable: true, note: '외부 API 비정형 필드 (category, channel 등)' },
          { name: 'source', type: 'TEXT', note: "CHECK IN ('manual_upload', 'external_api')" },
          { name: 'status', type: 'TEXT', note: "CHECK IN ('active', 'canceled') DEFAULT 'active'" },
          { name: 'received_at', type: 'TIMESTAMPTZ', note: '인입 시각 (application-set, API/파일 수신 시점)' },
          { name: 'created_at', type: 'TIMESTAMPTZ', note: 'row INSERT 시각 (DB DEFAULT now())' },
          { name: 'canceled_at', type: 'TIMESTAMPTZ', nullable: true, note: '취소 시각. NULL이면 활성' }
        ],
        extras: 'UNIQUE (store_id, external_order_number) — 중복 인입 방지. 3-layer 시제: ordered_at (외부 발생) → received_at (시스템 수신) → created_at (DB INSERT). 두 구간 지연 분석 가능 — 자세히는 datamodel.md §5.3.'
      },
      {
        name: 'point_ledgers',
        description: '포인트 원장 — 재무 진실만. 순수 append-only (예외 없음). 9 컬럼.',
        columns: [
          { name: 'id', type: 'BIGSERIAL', flags: ['pk'] },
          { name: 'brand_id', type: 'UUID', flags: ['fk'], note: '→ brands.id' },
          { name: 'delta', type: 'INTEGER', note: '양수=적립, 음수=차감. type 과 부호 일관성 CHECK 강제 (extras)' },
          { name: 'type', type: 'TEXT', note: 'credit_order / revert_request → delta > 0. revert_order / debit_request → delta < 0. adjust → delta ≠ 0' },
          { name: 'reference_type', type: 'TEXT', nullable: true, note: 'ledger / request (credit_order·adjust는 NULL)' },
          { name: 'reference_id', type: 'UUID', nullable: true, note: 'type에 따라 ledger.id / request.id (credit_order·adjust는 NULL)' },
          { name: 'idempotency_key', type: 'TEXT', flags: ['uk'] },
          { name: 'memo', type: 'TEXT', nullable: true, note: 'adjust 사유 (application에서 필수 강제)' },
          { name: 'created_at', type: 'TIMESTAMPTZ' }
        ],
        extras: 'reference 매핑: credit_order→NULL (원본 order_id는 idempotency_key에 보존), revert_order→ledger, debit/revert_request→request, adjust→NULL. CHECK 제약: (type IN (credit_order, revert_request) AND delta > 0) OR (type IN (revert_order, debit_request) AND delta < 0) OR (type = adjust AND delta ≠ 0) — 부호 실수로 인한 금전 사고 DB-level 차단. 적용 율은 delta÷amount로 역산. 적립 율은 application 코드의 calculate_credit_rate(order) 하드코딩 함수로 결정.'
      },
      {
        name: 'point_requests',
        description: '포인트 사용 신청 워크플로 객체. status 가변 — 신청 → 완료/반려/취소/환원.',
        columns: [
          { name: 'id', type: 'UUID', flags: ['pk'] },
          { name: 'user_id', type: 'UUID', flags: ['fk'], note: '→ users.id. 신청자' },
          { name: 'brand_id', type: 'UUID', flags: ['fk'], note: '→ brands.id. 차감 대상 brand' },
          { name: 'amount', type: 'INTEGER', note: '신청 금액 (양수), CHECK > 0' },
          { name: 'method', type: 'TEXT', note: '지급 방식 코드' },
          { name: 'idempotency_key', type: 'UUID', note: '클라이언트 발급 멱등성 키 (UUID v4). 더블탭·재시도 차단. point_ledgers.idempotency_key와 동일 개념·다른 발급 주체' },
          { name: 'status', type: 'TEXT', note: 'pending / completed / rejected / canceled / reverted' },
          { name: 'decided_at', type: 'TIMESTAMPTZ', nullable: true, note: '처리 시각. NULL이면 pending' },
          { name: 'decided_by_type', type: 'TEXT', nullable: true, note: "CHECK IN ('user','admin'). 폴리모픽. status 와 동기 CHECK 강제 (extras)" },
          { name: 'decided_by_id', type: 'UUID', nullable: true, note: 'user→users.id, admin→admins.id (폴리모픽 — FK 없음). DB-level CHECK: decided_at / decided_by_type / decided_by_id 3개 모두 NULL (status=pending) 또는 모두 NOT NULL (그 외 status)' },
          { name: 'memo', type: 'TEXT', nullable: true, note: '처리 노트 — 반려·취소·환원 사유 등. rejected 시 application에서 필수 강제' },
          { name: 'requested_at', type: 'TIMESTAMPTZ', note: '신청 시각 (application-set)' },
          { name: 'created_at', type: 'TIMESTAMPTZ', note: 'row INSERT 시각 (DB DEFAULT now())' },
          { name: 'updated_at', type: 'TIMESTAMPTZ' }
        ],
        extras: 'UNIQUE (user_id, idempotency_key) — 동일 user의 동일 키 재전송 차단. canceled 는 user (본인 취소) 또는 admin 양쪽 가능 → decided_by_type / decided_by_id 폴리모픽. CHECK 제약: status=pending ↔ decided_at·decided_by_type·decided_by_id 3개 모두 NULL (그 외 status 는 모두 NOT NULL). Pending 신청은 잔액에 영향 없음. 완료 처리 시 point_ledgers에 debit_request 행 INSERT (이 ledger INSERT 도 audit_logs 에 별도 audit). method별 추가 정보는 외부에서 admin이 사용자와 직접 확인.'
      },
      {
        name: 'audit_logs',
        description: '운영자·사용자 액션의 누가/언제/무엇을 추적. INSERT only. 폴리모픽 (target_type, target_id) 으로 모든 도메인 엔티티 참조.',
        columns: [
          { name: 'id', type: 'BIGSERIAL', flags: ['pk'] },
          { name: 'occurred_at', type: 'TIMESTAMPTZ', note: '발생 시각 (application-set, 도메인 액션 시점)' },
          { name: 'actor_type', type: 'TEXT', note: "CHECK IN ('admin','user','system'). actor_id 와 동기 CHECK 강제 (extras)" },
          { name: 'actor_id', type: 'UUID', nullable: true, note: 'admin→admins.id, user→users.id, system→NULL (폴리모픽 — FK 없음). DB-level CHECK: actor_type=system ↔ actor_id IS NULL' },
          { name: 'action', type: 'TEXT', note: '표준화된 verb. 복수형 테이블명 prefix. 모든 state-changing 액션 등재 (조회 GET 제외). 예: point_ledgers.adjust / .credit_order / .debit_request / .revert_order / .revert_request, orders.upload_batch / .external_ingest / .cancel / .credit_skipped(_batch_summary), point_requests.create / .decide, users.create / .update / .delete, admins.create / .update / .delete, brands.* / stores.*, brand_users.grant / .revoke, brand_stores.create / .terminate, admin_notifications.check, auth.login_success / .login_failure / .logout' },
          { name: 'target_type', type: 'TEXT', note: '복수형 테이블명 또는 가상 엔티티 (order_batches). 폴리모픽' },
          { name: 'target_id', type: 'TEXT', note: 'UUID/BIGINT → TEXT 통일' },
          { name: 'before', type: 'JSONB', nullable: true, note: '변경 전 full row JSON (INSERT 시 NULL)' },
          { name: 'after', type: 'JSONB', nullable: true, note: '변경 후 full row JSON (DELETE 시 NULL)' },
          { name: 'request_id', type: 'UUID', note: 'HTTP 요청 상관 ID — 같은 요청의 row 묶기' },
          { name: 'reason', type: 'TEXT', nullable: true, note: 'adjust 사유, credit_skipped 사유 (no_brand_mapping / rate_zero) 등' },
          { name: 'context', type: 'JSONB', nullable: true, note: 'IP / user_agent / batch_size / file_name 등 부가 메타' },
          { name: 'created_at', type: 'TIMESTAMPTZ', note: 'row INSERT 시각 (DB DEFAULT now())' }
        ],
        extras: 'INSERT only — UPDATE/DELETE 금지 (point_ledgers 동일). 같은 트랜잭션 내에서 도메인 변경과 함께 INSERT. 원칙: 모든 state-changing 액션이 audit_logs 에 기록 (조회 GET 제외). CHECK 제약: (actor_type=system AND actor_id IS NULL) OR (actor_type IN (admin,user) AND actor_id IS NOT NULL). occurred_at (application-set 발생) ≠ created_at (DB INSERT) — 보통 동일하나 backfill / 비동기 처리 시 분기. 주문 batch 등록은 target_type=order_batches 가상 엔티티 1행으로 묶어 row 폭증 방지. 정정은 새 row INSERT (action=audit.correction 등). 인덱스: (actor_type, actor_id, occurred_at DESC), (target_type, target_id, occurred_at DESC), (action, occurred_at DESC), (request_id), (occurred_at DESC).'
      },
      {
        name: 'admin_notifications',
        description: 'audit_logs의 부분집합에 대한 운영자 inbox. 본문은 audit_logs JOIN으로 획득.',
        columns: [
          { name: 'id', type: 'BIGSERIAL', flags: ['pk'] },
          { name: 'audit_log_id', type: 'BIGINT', flags: ['fk', 'uk'], note: '→ audit_logs.id (1:1). UNIQUE — 동일 audit row 중복 알림 차단' },
          { name: 'is_checked', type: 'BOOLEAN', note: 'DEFAULT FALSE. 운영자 확인 여부' },
          { name: 'checked_at', type: 'TIMESTAMPTZ', nullable: true, note: '확인 시각. NULL이면 미확인' },
          { name: 'created_at', type: 'TIMESTAMPTZ' }
        ],
        extras: 'NOTIFY 카탈로그는 application code의 set으로 관리 — schema migration 없음. INSERT 후 is_checked/checked_at만 UPDATE 가능, DELETE 허용 (오래된 checked 행 정리). severity/title/body 컬럼 없음 — 표시 데이터는 audit_logs JOIN으로 획득. row 단위가 아닌 batch summary action만 NOTIFY 대상 (예: orders.credit_skipped_batch_summary). acker (누가 ack 했나) 컬럼 없음 — admin_notifications.check audit action 으로 추적 (datamodel.md §4.9.2). 인덱스: (is_checked, created_at DESC).'
      }
    ];

    const groups = [
      { title: '도메인 핵심 · 브랜드 / 매장 / 매핑',  tables: ['brands', 'stores', 'brand_stores'] },
      { title: '사용자 · 멤버십 · 운영자',           tables: ['users', 'brand_users', 'admins'] },
      { title: '주문',                              tables: ['orders'] },
      { title: '포인트 원장 · 사용 신청',            tables: ['point_ledgers', 'point_requests'] },
      { title: '감사 · 알림',                       tables: ['audit_logs', 'admin_notifications'] }
    ];

    const tableMap = Object.fromEntries(tables.map(t => [t.name, t]));

    const STORAGE_KEY = 'franchise-manager-table-memos-v2';

    function loadMemos() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
      catch { return {}; }
    }
    function saveMemos(memos) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function renderCard(t, memos) {
      const hasMemo = (memos[t.name] || '').trim().length > 0;
      return `
        <article class="table-card ${hasMemo ? 'has-memo' : ''}" data-name="${t.name}">
          <header class="card-header">
            <div class="card-titleblock">
              <div class="card-title">${escapeHtml(t.name)}</div>
              <div class="card-desc">${escapeHtml(t.description)}</div>
            </div>
            <div class="col-count">${t.columns.length} cols</div>
          </header>
          <div class="columns">
            ${t.columns.map(c => `
              <div class="column">
                <div class="col-name ${c.nullable ? 'nullable' : ''}">
                  <span>${escapeHtml(c.name)}</span>
                  ${(c.flags || []).map(f => `<span class="pill ${f}">${f.toUpperCase()}</span>`).join('')}
                </div>
                <div class="col-type">${escapeHtml(c.type)}</div>
              </div>
              ${c.note ? `<div class="col-note">${escapeHtml(c.note)}</div>` : ''}
            `).join('')}
          </div>
          ${t.extras ? `<div class="extras"><span class="label">📌</span> ${escapeHtml(t.extras)}</div>` : ''}
          <div class="memo">
            <div class="memo-label">
              <span><span class="icon">📝</span> 메모 / 피드백</span>
              <span class="saved-indicator" data-saved="${t.name}"></span>
            </div>
            <textarea
              data-table="${t.name}"
              placeholder="이 테이블에 대한 변경 요청 / 의견 / 질문 등을 작성하세요. 작성 후 우측 상단 '피드백 복사' 버튼으로 한 번에 내보낼 수 있습니다."
            >${escapeHtml(memos[t.name] || '')}</textarea>
          </div>
        </article>`;
    }

    function render() {
      const canvas = document.getElementById('canvas');
      const memos = loadMemos();
      canvas.innerHTML = groups.map(g => `
        <section class="row-group">
          <header class="group-title">${escapeHtml(g.title)}</header>
          <div class="row" data-cols="${g.tables.length}">
            ${g.tables.map(name => renderCard(tableMap[name], memos)).join('')}
          </div>
        </section>
      `).join('');

      // Attach memo handlers
      document.querySelectorAll('textarea[data-table]').forEach(ta => {
        let debounceTimer;
        ta.addEventListener('input', () => {
          const m = loadMemos();
          m[ta.dataset.table] = ta.value;
          saveMemos(m);

          // visual: card highlight
          const card = ta.closest('.table-card');
          if (ta.value.trim()) card.classList.add('has-memo');
          else card.classList.remove('has-memo');

          // saved indicator
          const indicator = document.querySelector(`[data-saved="${ta.dataset.table}"]`);
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            indicator.textContent = '저장됨';
            indicator.classList.add('saved');
            setTimeout(() => {
              indicator.textContent = '';
              indicator.classList.remove('saved');
            }, 1400);
          }, 250);
        });
      });

      const totalCols = tables.reduce((s, t) => s + t.columns.length, 0);
      document.getElementById('meta').textContent = `${tables.length} tables · ${totalCols} columns`;
    }

    function exportFeedback() {
      const memos = loadMemos();
      const filled = tables
        .filter(t => (memos[t.name] || '').trim().length > 0)
        .map(t => ({ name: t.name, memo: memos[t.name].trim() }));

      if (filled.length === 0) {
        showToast('작성된 메모가 없습니다');
        return;
      }

      const lines = [
        '## datamodel.md 피드백 — 테이블별 메모',
        '',
        `다음은 \`tables.html\`에서 작성한 ${filled.length}개 테이블에 대한 피드백입니다. 이 내용을 반영해 \`docs/datamodel.md\`를 업데이트해주세요.`,
        ''
      ];
      for (const { name, memo } of filled) {
        lines.push(`### \`${name}\``);
        lines.push('');
        // indent multi-line memos as blockquote
        memo.split('\n').forEach(line => lines.push(`> ${line}`));
        lines.push('');
      }
      const markdown = lines.join('\n');

      navigator.clipboard.writeText(markdown).then(
        () => showToast(`${filled.length}개 메모를 클립보드에 복사했습니다`),
        () => {
          // fallback: show in prompt
          window.prompt('복사가 자동으로 안 되면 아래 내용을 직접 복사하세요:', markdown);
        }
      );
    }

    function clearAllMemos() {
      const memos = loadMemos();
      const filled = Object.values(memos).filter(v => (v || '').trim()).length;
      if (filled === 0) {
        showToast('초기화할 메모가 없습니다');
        return;
      }
      if (!confirm(`작성된 메모 ${filled}개를 모두 삭제하시겠습니까?`)) return;
      localStorage.removeItem(STORAGE_KEY);
      render();
      showToast('모든 메모를 초기화했습니다');
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function applyFilter() {
      const q = document.getElementById('filter').value.trim().toLowerCase();
      document.querySelectorAll('.table-card').forEach(card => {
        if (!q) { card.classList.remove('hidden'); return; }
        const text = card.textContent.toLowerCase();
        card.classList.toggle('hidden', !text.includes(q));
      });
      // hide row groups that have no visible cards
      document.querySelectorAll('.row-group').forEach(g => {
        const anyVisible = g.querySelector('.table-card:not(.hidden)');
        g.classList.toggle('hidden', !anyVisible);
      });
    }

    document.getElementById('btn-export').onclick = exportFeedback;
    document.getElementById('btn-clear').onclick = clearAllMemos;
    document.getElementById('filter').addEventListener('input', applyFilter);

    // Cmd/Ctrl + Enter to export
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        exportFeedback();
      }
    });

    render();
  </script>
</body>
</html>
